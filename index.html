<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XIMG Viewer</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#17191c;min-height:100vh;display:grid;place-items:center}.shell{width:min(760px,92vw);background:#fff;border:1px solid #d9dce1;border-radius:18px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.06)}.brand{font-size:28px;font-weight:700;letter-spacing:-.03em}.tag{display:inline-block;margin-top:8px;padding:5px 9px;border:1px solid #d9dce1;border-radius:999px;font-size:12px;color:#5d636b}.panel{margin-top:28px;border:1px dashed #b9bec6;border-radius:14px;padding:42px 24px;text-align:center;background:#fafafa}.panel h1{font-size:20px;margin:0 0 8px}.panel p{margin:0;color:#656b73;line-height:1.5}.status{margin-top:22px;padding-top:20px;border-top:1px solid #eceef1;color:#656b73;font-size:14px}.footer{margin-top:24px;font-size:12px;color:#858b93;text-align:center}</style>
</head>
<body>
  <main class="shell">
    <div class="brand">XIMG Viewer</div>
    <div class="tag">Custom image format</div>
    <section class="panel">
      <h1>Viewer ready</h1>
      <p>This is the initial static interface for the XIMG web viewer.<br>Image decoding will be added with the XIMG specification.</p>
    </section>
    <div class="status">No image loaded</div>
    <div class="footer">XIMG — an experimental web-compatible image format</div>
  </main>
</body>
</html>
